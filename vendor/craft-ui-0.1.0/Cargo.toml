[package]
edition = "2024"
rust-version = "1.95"
name = "craft-ui"
version = "0.1.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Reusable egui controls and icon catalogs for Craft frontends"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/storytold/craft-libs"

[features]
color_fonts = ["epaint/color_fonts"]
default = []
native-windows = []
screen-testing = ["dep:egui_kittest"]
serde = ["dep:serde"]
system_fonts = [
    "dep:fontique",
    "dep:unicode-script",
]
testing = []

[lib]
name = "craft_ui"
path = "src/lib.rs"

[[example]]
name = "docking_native"
path = "examples/docking_native.rs"
required-features = ["native-windows"]

[[example]]
name = "ui_hotpaths"
path = "examples/ui_hotpaths.rs"

[[test]]
name = "docking_workflows"
path = "tests/docking_workflows.rs"

[[test]]
name = "fonts_render"
path = "tests/fonts_render.rs"

[[test]]
name = "screens"
path = "tests/screens.rs"
required-features = ["screen-testing"]

[[test]]
name = "visual_regression"
path = "tests/visual_regression.rs"

[[test]]
name = "web_fonts"
path = "tests/web_fonts.rs"

[dependencies]
log = "0.4"

[dependencies.craft-fonts-build]
path = "../fonts-build"

[dependencies.craft-i18n]
path = "../i18n"

[dependencies.egui]
version = "0.37"
default-features = false

[dependencies.epaint]
version = "0.37"
default-features = false

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.skrifa]
version = "0.44"
features = ["std"]
default-features = false

[dev-dependencies]
serde_json = "1"

[dev-dependencies.egui]
version = "0.37"
features = [
    "default_fonts",
    "serde",
]
default-features = false

[dev-dependencies.egui_extras]
version = "0.37"
features = ["svg"]
default-features = false

[dev-dependencies.image]
version = "0.25"
features = ["png"]
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.egui_kittest]
version = "0.37"
features = [
    "snapshot",
    "wgpu",
]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.fontique]
version = "0.11.1"
features = [
    "system",
    "fontconfig-dlopen",
]
optional = true
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.unicode-script]
version = "0.5.8"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.eframe]
version = "0.37"
features = [
    "wgpu",
    "x11",
    "default_fonts",
]
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.egui_kittest]
version = "0.37"
features = ["wgpu"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "RequestInit",
    "Response",
    "console",
]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Response",
]

[target.'cfg(target_os = "macos")'.dependencies]
